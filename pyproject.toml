[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backprop-lib"
version = "0.1.0"
description = "A tiny scalar-valued autograd engine with a small PyTorch-like neural network library on top."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Sibananda Dora" },
]
keywords = ["autograd", "backprop", "micrograd", "neural-networks", "deep-learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["graphviz", "matplotlib", "numpy"]

[project.optional-dependencies]
viz = ["graphviz"]
dev = ["pytest", "jupyter", "build", "twine"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Sibananda-Dora/Backpropagation_lib"
Source = "https://github.com/Sibananda-Dora/Backpropagation_lib"
Issues = "https://github.com/Sibananda-Dora/Backpropagation_lib/issues"

[tool.hatch.build.targets.wheel]
packages = ["backprop"]

[tool.pytest.ini_options]
testpaths = ["test"]
